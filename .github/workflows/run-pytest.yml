# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Run Test with PyTest and Codecov

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ master ]
  schedule:
    # nightly full suite (incl. `db`-marked tests that download real databases),
    # 02:30 Beijing time
    - cron: "30 18 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "core"
        type: choice
        options: ["core", "full"]

env:
  PYTHON_PRIMARY_VERSION: '3.12'
  SHHS_DATA_AVAILABLE: 'false'

jobs:
  # The nightly schedule fires unconditionally; this gate skips the heavy
  # builds when master has not advanced since the last nightly run actually
  # tested something (quiet days cost ~10 seconds instead of hours). If
  # several commits land in one day, the nightly simply tests whatever is
  # the HEAD of master at fire time -- earlier commits were already
  # validated by their PRs' core lane.
  nightly-gate:
    if: github.repository_owner == 'DeepPSP'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "not a scheduled run -> run"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # head_sha of the latest *other* scheduled run of this workflow
          LAST_SHA=$(gh api "repos/${{ github.repository }}/actions/runs?event=schedule&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "${{ github.workflow }}" and (.id != ${{ github.run_id }}))][0].head_sha // ""')
          echo "last nightly tested: ${LAST_SHA:-<none>}"
          echo "current HEAD:        ${{ github.sha }}"
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "master unchanged since the last nightly run -> skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    # Don't run on forked repos.
    if: github.repository_owner == 'DeepPSP' && needs.nightly-gate.outputs.run == 'true'
    needs: nightly-gate

    runs-on: ubuntu-22.04
    # fail with an explicit timeout instead of being hard-killed at 6h
    # (which renders as "cancelled" and hides the cause)
    timeout-minutes: 350
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.13"]
      fail-fast: false
    env:
      # `core` = fast lane, deselects `db`-marked tests (no database downloads);
      # `full` = the whole suite.  PRs and dev pushes only need the fast lane;
      # the full suite runs nightly and on manual dispatch, so that slow or
      # flaky database downloads cannot eat the whole CI budget.
      SUITE: ${{ (github.event_name == 'schedule') && 'full' || (github.event_name == 'workflow_dispatch') && inputs.suite || 'core' }}
    steps:
    - uses: actions/checkout@v7
    - name: Clear unnecessary system components
      run: |
        echo "Free space:"
        df -h
        sudo rm -rf /usr/local/lib/android # will release about 10 GB if you don't need Android
        sudo rm -rf /usr/share/dotnet # will release about 20GB if you don't need .NET
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: Install system libraries
      run: |
        sudo apt update
        sudo apt install build-essential ffmpeg libsm6 libxext6 libsndfile1 git -y
        if command -v aws &> /dev/null; then aws --version; else echo "aws cli not found"; fi
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0' # Not needed with a .ruby-version file
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
    - name: List existing Python packages
      run: |
        python -m pip list
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements.txt
        python -m pip install pytest pytest-xdist pytest-cov # Testing packages
        python -m pip uninstall torch-ecg --yes # Remove if already installed
        python setup.py install_egg_info # Workaround https://github.com/pypa/pip/issues/4537
        python -m pip install -e .[dev]
        python -m pip freeze
    - name: List installed Python packages
      run: |
        python -m pip list
    - name: Install nsrr and download a small part of SHHS to do test
    # ref. https://github.com/DeepPSP/nsrr-automate
      # uses: gacts/run-and-post-run@v1
      continue-on-error: true
      if: ${{ env.SHHS_DATA_AVAILABLE == 'true' && env.SUITE == 'full' }}
      run: |
        set -u -o pipefail
        gem install nsrr --no-document
        nsrr download shhs/polysomnography/edfs/shhs1/ --file="^shhs1\-20010.*\.edf" --token=${{ secrets.NSRR_TOKEN }} 2>&1 | sed -E '/^[[:space:]]*[Ss]kipped([[:space:]]|$)/d' || true
        nsrr download shhs/polysomnography/annotations-events-nsrr/shhs1/ --file="^shhs1\-20010.*\-nsrr\.xml" --token=${{ secrets.NSRR_TOKEN }} 2>&1 | sed -E '/^[[:space:]]*[Ss]kipped([[:space:]]|$)/d' || true
        nsrr download shhs/polysomnography/annotations-events-profusion/shhs1/ --file="^shhs1\-20010.*\-profusion\.xml" --token=${{ secrets.NSRR_TOKEN }} 2>&1 | sed -E '/^[[:space:]]*[Ss]kipped([[:space:]]|$)/d' || true
        nsrr download shhs/polysomnography/annotations-rpoints/shhs1/ --file="^shhs1\-20010.*\-rpoint\.csv" --token=${{ secrets.NSRR_TOKEN }} 2>&1 | sed -E '/^[[:space:]]*[Ss]kipped([[:space:]]|$)/d' || true
        nsrr download shhs/datasets/ --shallow --token=${{ secrets.NSRR_TOKEN }} 2>&1 | sed -E '/^[[:space:]]*[Ss]kipped([[:space:]]|$)/d' || true
        nsrr download shhs/datasets/hrv-analysis/ --token=${{ secrets.NSRR_TOKEN }} 2>&1 | sed -E '/^[[:space:]]*[Ss]kipped([[:space:]]|$)/d' || true

        mkdir -p ~/tmp/nsrr-data/
        mv shhs/ ~/tmp/nsrr-data/
        du -sh ~/tmp/nsrr-data/* || true

        EDF_COUNT=$(find ~/tmp/nsrr-data/shhs -type f -name "*.edf" 2>/dev/null | wc -l | tr -d ' ')
        echo "Detected SHHS EDF file count: $EDF_COUNT"

        if [ "$EDF_COUNT" -eq 0 ]; then
          echo "::error title=No SHHS EDF files downloaded::No .edf files were downloaded (token may be invalid or pattern mismatch). SHHS tests will be skipped."
          echo "No SHHS EDF files downloaded; setting SHHS_DATA_AVAILABLE=false"
          echo "SHHS_DATA_AVAILABLE=false" >> $GITHUB_ENV
          exit 1
        else
          echo "Found $EDF_COUNT SHHS EDF files; setting SHHS_DATA_AVAILABLE=true"
          echo "SHHS_DATA_AVAILABLE=true" >> $GITHUB_ENV
        fi
      # post: |
      #   cd ~/tmp/ && du -sh $(ls -A)
      #   rm -rf ~/tmp/nsrr-data/
      #   cd ~/tmp/ && du -sh $(ls -A)
    - name: Run test with pytest and collect coverage
      run: |
        echo "SHHS_DATA_AVAILABLE at test step: $SHHS_DATA_AVAILABLE"
        echo "SUITE at test step: $SUITE"
        if [ "$SUITE" = "full" ]; then
          pytest --cov --junitxml=junit.xml -o junit_family=legacy
        else
          pytest -m "not db" --cov --junitxml=junit.xml -o junit_family=legacy
        fi
      env:
        SHHS_DATA_AVAILABLE: ${{ env.SHHS_DATA_AVAILABLE }}
    - name: Upload coverage to Codecov
      if: ${{ matrix.python-version == env.PYTHON_PRIMARY_VERSION }}
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true # optional (default = false)
        verbose: true # optional (default = false)
        token: ${{ secrets.CODECOV_TOKEN }} # required
        flags: ${{ env.SUITE }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Cleanup SHHS temp data
      if: always() && true
      run: |
        # `~/tmp` is created by the SHHS download step above; when that step
        # is skipped (core lane, or SHHS unavailable) the directory does not
        # exist at all, hence the `mkdir -p` guard.
        mkdir -p ~/tmp
        cd ~/tmp/ && du -sh $(ls -A) || true
        rm -rf ~/tmp/nsrr-data/
        cd ~/tmp/ && du -sh $(ls -A) || true
