# This workflow will build a Python project using sdist bdist_wheel
# and publish to PyPI.

name: Publish

on:
  push:
    tags:
      - 'v*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  ARTIFACT_NAME: torch_ecg_dist
  ARTIFACT_DIR: dist
  # OS_NAME_VERSION: ubuntu-22.04

jobs:
  build:
    # Don't run on forked repos.
    if: github.repository_owner == 'DeepPSP'

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip' # caching pip dependencies
    - name: List existing Python packages
      run: |
        python -m pip list
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        pip install -r requirements.txt
    - name: List installed Python packages
      run: |
        python -m pip list
    - name: Build
      run: |
        python -m build
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        # `with:` inputs need the `${{ }}` expression form; the previous
        # bare `$ARTIFACT_NAME` passed the literal string (it only worked
        # because upload and download used the same literal name)
        name: ${{ env.ARTIFACT_NAME }}
        path: dist

  pypi-publish:
    # publishing is separate from building
    needs: build
    name: Upload release to PyPI
    runs-on: ubuntu-22.04
    environment:
      name: release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Publish package to TestPyPI  # to test, use https://test.pypi.org/
        # no `password`: authenticates via Trusted Publishing (OIDC), using
        # the job-level `environment: release` + `id-token: write` above;
        # the publisher is registered on test.pypi.org for this repo /
        # workflow / environment.  With no token, `attestations` also
        # takes effect (PEP 740 provenance signatures).
        # tolerate "file already exists" (e.g. when re-running the workflow
        # after a partial release), so the PyPI step still runs
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ${{ env.ARTIFACT_DIR }}
      - name: Remove attestations generated by the TestPyPI publish
        # the two publish steps share the same dist/ directory; the leftover
        # *.publish.attestation files would make the PyPI step fail with
        # "distributions already have publish attestations" (hit during the
        # bib_lookup v0.2.0 release, fixed there in a7fa7eb)
        run: rm -f ${{ env.ARTIFACT_DIR }}/*.publish.attestation
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.ARTIFACT_DIR }}

  github-release:
    # GitHub release: the release's CHANGELOG.md section as the preamble,
    # GitHub's auto-generated "What's Changed" PR list appended (no PR labels
    # required), and the sdist attached as an asset.  The body and the
    # generated notes must be provided in the SAME create call
    # (`body_path` + `generate_release_notes`): GitHub only generates
    # "What's Changed" at creation time, and PATCHing the body of an existing
    # release never re-appends it.
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Extract changelog section for this release
        # this repository keeps a Keep-a-Changelog markdown history (released
        # sections headed `## [<version>] - <YYYY-MM-DD>`) and does not use
        # PR labels, so the previous label-driven changelog builder produced
        # near-empty notes; the section extraction needs no labels and no
        # extra permissions
        run: |
          python3 - <<'PY'
          import os, re

          tag = os.environ["GITHUB_REF_NAME"]  # e.g. v0.0.34
          ver = tag.lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pat = re.compile(r"^## \[(?P<v>\d[\w.]*)\] - \d{4}-\d{2}-\d{2}$", re.M)
          matches = list(pat.finditer(text))
          body = ""
          for i, m in enumerate(matches):
              if m.group("v") == ver:
                  start = m.end()
                  end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
                  body = text[start:end].strip()
                  break
          if not body:
              body = "See [CHANGELOG.md](https://github.com/DeepPSP/torch_ecg/blob/master/CHANGELOG.md)."
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(f"# Changes in {tag}\n\n{body}\n")
          PY
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          generate_release_notes: true
          # attach the sdist to the release (numpy-style: source on GitHub,
          # wheels stay PyPI-only); glob matches torch_ecg-<ver>.tar.gz only
          files: ${{ env.ARTIFACT_DIR }}/*.tar.gz
