# This workflow will build a Python project using sdist bdist_wheel
# and publish to PyPI.

name: Publish

on:
  push:
    tags:
      - 'v*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  ARTIFACT_NAME: torch_ecg_dist
  ARTIFACT_DIR: dist
  # OS_NAME_VERSION: ubuntu-22.04

jobs:
  build:
    # Don't run on forked repos.
    if: github.repository_owner == 'DeepPSP'

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip' # caching pip dependencies
    - name: List existing Python packages
      run: |
        python -m pip list
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        pip install -r requirements.txt
    - name: List installed Python packages
      run: |
        python -m pip list
    - name: Build
      run: |
        python -m build
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        # `with:` inputs need the `${{ }}` expression form; the previous
        # bare `$ARTIFACT_NAME` passed the literal string (it only worked
        # because upload and download used the same literal name)
        name: ${{ env.ARTIFACT_NAME }}
        path: dist

  pypi-publish:
    # publishing is separate from building
    needs: build
    name: Upload release to PyPI
    runs-on: ubuntu-22.04
    environment:
      name: release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Publish package to TestPyPI  # to test, use https://test.pypi.org/
        # no `password`: authenticates via Trusted Publishing (OIDC), using
        # the job-level `environment: release` + `id-token: write` above;
        # the publisher is registered on test.pypi.org for this repo /
        # workflow / environment.  With no token, `attestations` also
        # takes effect (PEP 740 provenance signatures).
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ${{ env.ARTIFACT_DIR }}
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.ARTIFACT_DIR }}

  github-release:
    # github release and changelog
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Build Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configurationJson: |
            {
              "template": "# Changelog\n\n{{CHANGELOG}}\n\n<details>\n<summary>📦 Other changes</summary>\n\n{{UNCATEGORIZED}}\n\n</details>",
              "categories": [
                {
                  "title": "🚀 Features",
                  "labels": ["feature","enhancement"]
                },
                {
                  "title": "🐛 Bug Fixes",
                  "labels": ["bug","fix"]
                },
                {
                  "title": "📚 Documentation",
                  "labels": ["documentation","docs"]
                },
                {
                  "title": "⬆️ Dependencies",
                  "labels": ["dependencies"]
                },
                {
                  "title": "🧰 Maintenance",
                  "labels": ["chore","ci"]
                }
              ],
              "exclude_labels": [
                "pre-commit"
              ]
            }
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          # attach the sdist to the release (numpy-style: source on GitHub,
          # wheels stay PyPI-only); glob matches torch_ecg-<ver>.tar.gz only
          files: ${{ env.ARTIFACT_DIR }}/*.tar.gz
