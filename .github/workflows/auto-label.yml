name: Auto Label

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # `actions-ecosystem/action-add-labels` is archived; use the
      # preinstalled `gh` CLI instead of a third-party action.
      # The `pre-commit` label feeds the release changelog builder,
      # which excludes PRs carrying it from the "Other changes" section.
      - name: Label pre-commit PR
        if: github.actor == 'pre-commit-ci[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label pre-commit
